<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosphere</title>

  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f1ee;
      color: #10302b;
      margin: 0;
    }

  
    header {
      background-color: white;
      text-align: center;
      padding: 15px;
    }

    header h1 {
      color: #1b6b5f;
      margin: 0;
    }

    nav a {
      color: #10302b;
      margin: 0 10px;
    }

   
    .music {
      background-color: white;
      text-align: center;
      padding: 10px;
    }

    
    .banner {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    
    .media {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .box {
      width: 48%;
      display: inline-block;
      vertical-align: top;
      margin-bottom: 15px;
    }

    .box iframe,
    .box video {
      width: 100%;
      height: 280px;
      border: 0;
    }

   
    .form-section {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
    }

    .form-section input,
    .form-section select,
    .form-section textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
    }

    footer {
      background-color: #10302b;
      color: white;
      text-align: center;
      padding: 10px;
    }

    
    @media (max-width: 700px) {
      .box {
        width: 100%;
      }
    }
  </style>
</head>

<body>

 
  <header>
    <h1>Ecosphere</h1>
    <p>Sustainable Supply Chain and Logistics</p>
    <nav>
      
      <a href="#media">Media Elements</a>
      <a href="#application">Application Form</a>
    </nav>
  </header>

  
  <div class="music">
    <p>Play Music:</p>
    <audio controls autoplay>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  
  <img class="banner"
       src="https://placehold.co/1200x300/1b6b5f/ffffff?text=Ecosphere+-+Sustainable+Logistics"
       alt="Ecosphere banner">

  
  <div class="media" id="media">
    <h2>Media Elements</h2>

   
    <div class="box">
      <iframe src="Ecosphere.pdf"
              title="Ecosphere PDF"></iframe>
    </div>

  
    <div class="box">
      <iframe src="https://youtu.be/LgnXizpZ2GY?si=JmlrnfCEJSFNW7bZ"
              title="Ecosphere YouTube video"
              allowfullscreen></iframe>
    </div>

    
    <div class="box">
      <video controls>
        <source autoplay src="ecosphere.mp4" type="video/mp4">
        <source autoplay src="ecosphere.mp4" type="video/ogg">
        Your browser does not support the video tag.
      </video>
    </div>

    
    <div class="box">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3917.3598830116985!2d76.74148607536158!3d10.936163989222454!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba866bd6aaaaaab%3A0xc650b8a75e7b51f0!2sKarunya%20Institute%20of%20Technology%20and%20Sciences%20(Deemed%20University)!5e0!3m2!1sen!2sin!4v1790841741287!5m2!1sen!2sin"
              title="Ecosphere location"></iframe>
    </div>
  </div>

  
  <div class="form-section" id="application">
    <h2>Application Form</h2>
    <form>
      <label>Full Name</label>
      <input type="text" required>

      <label>Email</label>
      <input type="email" required>

      <label>Role</label>
      <select>
        <option>Supply Chain Analyst</option>
        <option>Fleet Sustainability Coordinator</option>
        <option>Warehouse Operations</option>
      </select>

      <label>Why do you want to join Ecosphere?</label>
      <textarea rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 Ecosphere</p>
  </footer>

</body>
</html>
